<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>About · TIKOONZ TV</title>
<style>
:root{
  --max:1120px;
  --bg:#0b0b0f;
  --card:#141420;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --text2:rgba(255,255,255,.78);
  --text3:rgba(255,255,255,.62);
  --radius:16px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:#fff;
}
a{color:inherit;text-decoration:none;}
.wrap{max-width:var(--max);margin:0 auto;padding:24px;}

header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(10px);
  background:rgba(11,11,15,.72);
  border-bottom:1px solid var(--line);
}
.headInner{
  position:relative;
  max-width:var(--max);
  margin:0 auto;
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand img{height:28px;display:block;}
nav{display:flex;align-items:center;gap:16px;font-size:14px;color:var(--text2);}
nav a{
  padding:8px 10px;border-radius:10px;border:1px solid transparent;
}
nav a:hover{
  border-color:var(--line2);background:rgba(255,255,255,.03);
}
nav a.active{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.03);}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.ratio{position:relative;width:100%;padding-top:56.25%;background:#000;}
iframe.video{position:absolute;inset:0;width:100%;height:100%;border:0;}

.content{
  padding:22px;
  line-height:1.85;
  color:var(--text2);
  font-size:14px;
  text-align:justify;
  text-justify:inter-word;
}
.sectionLabel{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);margin:0 0 14px;}
.content p{max-width:100%;margin:0 0 16px;}

.langInline{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-bottom:12px;
}
.langInline button{
  background:transparent;
  border:1px solid rgba(255,255,255,.16);
  color:rgba(255,255,255,.78);
  padding:6px 8px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}
.langInline button:hover{
  background:rgba(255,255,255,.05);
}

/* Arabic RTL */
html[dir="rtl"] body{ direction: rtl; }
html[dir="rtl"] .content{ direction: rtl; }

footer{margin-top:28px;border-top:1px solid var(--line);padding:18px 0 26px;color:var(--text3);font-size:12px;}
.footInner{max-width:var(--max);margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;}
.footLinks{display:flex;gap:14px;flex-wrap:wrap;}
.footLinks a{color:var(--text2);}
</style>
</head>
<body>

<header>
  <div class="headInner">
    <a class="brand" href="index.html"><img src="tikoonz-logo.png" alt="TIKOONZ" /></a>
    <nav>
      <a href="about.html" class="active">About</a>
      <a href="shows.html">Shows</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="ratio">
      <iframe class="video"
        src="https://www.youtube-nocookie.com/embed/UAwvxZ8qJj4?autoplay=1&loop=1&playlist=UAwvxZ8qJj4&playsinline=1"
        allow="autoplay"></iframe>
    </div>
  </section>

  <section class="card" style="margin-top:16px;">
    <div class="content">
      <div class="langInline">
        <button onclick="applyLang('en')">EN</button>
        <button onclick="applyLang('ko')">KO</button>
      </div>

      <p id="aboutLabel" class="sectionLabel">About</p>
      <p id="aboutP1">TIKOONZ TV is a Korean-based music talk platform where professors and industry professionals examine contemporary music — from Hip-Hop and EDM to K-POP.</p>
    </div>
  </section>
</main>

<footer>
  <div class="footInner">
    <div>© TIKOONZ TV</div>
    <div class="footLinks">
      <a href="https://tikoonz.com" target="_blank" rel="noopener">TIKOONZ</a>
      <a href="https://tikoonz.shop" target="_blank" rel="noopener">SHOP</a>
      <a href="https://www.youtube.com/@tikoonz" target="_blank" rel="noopener">@TIKOONZ</a>
    </div>
  </div>
</footer>


<script>
const I18N={
  en:{label:"About",p1:"TIKOONZ TV is a Korean-based music talk platform where professors and industry professionals examine contemporary music — from Hip-Hop and EDM to K-POP."},
  ko:{label:"소개",p1:"TIKOONZ TV는 한국을 기반으로 한 음악 토크 플랫폼으로, 교수진과 업계 전문가가 힙합·EDM·K-POP 등 동시대 음악을 분석하고 맥락화합니다."}
};
function applyLang(l){
  const d=I18N[l]||I18N.en;
  document.getElementById("aboutLabel").textContent=d.label;
  document.getElementById("aboutP1").textContent=d.p1;
  document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");
}
</script>

</body>
</html>
