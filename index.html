<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIKOONZ.TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}button{font:inherit}
header{padding:54px 24px 22px;text-align:center;background:#000}
.logo{width:min(520px,82vw);height:auto;display:block;margin:0 auto 24px}
nav{display:flex;justify-content:center;align-items:center;gap:34px;font-size:12px;font-weight:700;letter-spacing:.18em}
nav a{color:#fff;text-decoration:none;opacity:.78}nav a:hover,nav a.active{opacity:1}
.lang{position:absolute;right:28px;top:32px;background:none;border:0;color:#aaa;font-size:11px;letter-spacing:.14em}
.cinema{width:min(1500px,100%);margin:auto;background:#000}
.playerWrap{position:relative;aspect-ratio:16/9;background:#050505}
#heroPlayer{position:absolute;inset:0;width:100%;height:100%}
.intro{width:min(1500px,calc(100% - 48px));margin:0 auto;padding:70px 0 42px}
.kicker{font-size:10px;letter-spacing:.28em;color:#777;margin-bottom:16px}
h1{font-size:clamp(48px,8vw,132px);line-height:.82;letter-spacing:-.07em;margin:0;font-weight:900}
.sub{margin-top:20px;color:#777;font-size:11px;letter-spacing:.22em}

/* clean standalone installation */
.installation{position:relative;background:
 radial-gradient(circle at 50% 28%,rgba(112,72,35,.16),transparent 34%),
 linear-gradient(180deg,#050505 0%,#020202 70%,#000 100%);
 padding:48px 22px 86px;overflow:hidden}
.stage{width:min(1500px,100%);margin:auto;display:grid;grid-template-columns:repeat(12,1fr);
 grid-auto-rows:clamp(62px,6vw,112px);gap:14px;perspective:1500px;position:relative}
.stage:after{content:"";position:absolute;left:3%;right:3%;bottom:-35px;height:60px;
 background:radial-gradient(ellipse,rgba(205,130,58,.18),transparent 66%);filter:blur(13px);pointer-events:none}
.tv{position:relative;background:linear-gradient(145deg,#5c3b20 0%,#15110e 14%,#050505 54%,#402817 100%);
 border:1px solid rgba(222,151,77,.62);padding:9px;border-radius:11px;
 box-shadow:inset 0 0 0 2px #050505,inset 0 0 0 3px rgba(255,194,113,.12),
 0 18px 36px rgba(0,0,0,.72),0 0 20px rgba(161,87,26,.10);
 cursor:pointer;overflow:hidden;min-width:0}
.tv:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;right:5px;bottom:5px;background:#8c431c;box-shadow:0 0 8px #c85f25}
.screen{position:absolute;inset:9px;border-radius:5px;overflow:hidden;background:#000;box-shadow:inset 0 0 18px #000}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.08),transparent 25%,transparent 75%,rgba(255,255,255,.025))}
.screen img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.9) contrast(1.06) saturate(.94);transition:.25s}
.tv:hover img{filter:brightness(1.08) contrast(1.05) saturate(1.04);transform:scale(1.015)}
.tv:hover{z-index:20}

/* 23 screens, deliberate sculpture rhythm */
.tv:nth-child(1){grid-column:4/10;grid-row:1/5}
.tv:nth-child(2){grid-column:1/4;grid-row:1/3;transform:rotateY(8deg) rotateZ(-1deg)}
.tv:nth-child(3){grid-column:1/4;grid-row:3/5;transform:rotateY(8deg) rotateZ(1deg)}
.tv:nth-child(4){grid-column:10/13;grid-row:1/3;transform:rotateY(-8deg) rotateZ(1deg)}
.tv:nth-child(5){grid-column:10/13;grid-row:3/5;transform:rotateY(-8deg) rotateZ(-1deg)}
.tv:nth-child(6){grid-column:1/3;grid-row:5/7}.tv:nth-child(7){grid-column:3/5;grid-row:5/7}
.tv:nth-child(8){grid-column:5/7;grid-row:5/7}.tv:nth-child(9){grid-column:7/9;grid-row:5/7}
.tv:nth-child(10){grid-column:9/11;grid-row:5/7}.tv:nth-child(11){grid-column:11/13;grid-row:5/7}
.tv:nth-child(12){grid-column:1/4;grid-row:7/9}.tv:nth-child(13){grid-column:4/6;grid-row:7/9}
.tv:nth-child(14){grid-column:6/8;grid-row:7/9}.tv:nth-child(15){grid-column:8/10;grid-row:7/9}
.tv:nth-child(16){grid-column:10/13;grid-row:7/9}
.tv:nth-child(17){grid-column:1/3;grid-row:9/11}.tv:nth-child(18){grid-column:3/5;grid-row:9/11}
.tv:nth-child(19){grid-column:5/7;grid-row:9/11}.tv:nth-child(20){grid-column:7/9;grid-row:9/11}
.tv:nth-child(21){grid-column:9/11;grid-row:9/11}.tv:nth-child(22){grid-column:11/13;grid-row:9/11}
.tv:nth-child(23){grid-column:4/10;grid-row:11/14}

footer{padding:70px 24px;text-align:center;color:#555;font-size:10px;letter-spacing:.18em}
@media(max-width:760px){
 header{padding-top:44px}.logo{width:min(390px,86vw);margin-bottom:20px}
 nav{gap:16px;font-size:10px}.lang{right:10px;top:18px;font-size:9px}
 .intro{width:calc(100% - 28px);padding:52px 0 30px}
 .installation{padding:22px 10px 52px}
 .stage{grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;gap:10px;perspective:none}
 .tv:nth-child(n){grid-column:auto;grid-row:auto;transform:none;aspect-ratio:16/10}
 .tv:nth-child(1),.tv:nth-child(23){grid-column:1/-1;aspect-ratio:16/9}
}
</style>
</head>
<body>
<header>
  <img class="logo" src="tikoonz-logo.png" alt="TIKOONZ.TV">
  <nav><a class="active" href="index.html">HOME</a><a href="visual.html">VISUAL</a><a href="shows.html">SHOWS</a><a href="about.html">ABOUT</a></nav>

<main>

<script>
const PLAYLIST=["k6vBizqAXBs", "2_ZXLTNgjeg", "jBWnWCUseyI", "dg194QhkGE0", "dwNzAA-G5a8", "lRFQZs2mR-I", "Uy6KpYZeERI", "K1fF0DFRJKw", "Hg0ZsqPn084", "N1j4gXlzKGI", "5ZJuAOeQX5Y", "n7PnboBqSLU", "KTMHd5qm7xQ", "EmTxU_-dPEM", "s2yqp_jMQEE", "u-5e6fMhKG0", "kD4U54YbCqU", "UAwvxZ8qJj4", "236bi4YaQuM", "JDozHJlRkuE", "snr9HhPGt2U", "1UTqafvnSNg", "CiFPVqZIUdg", "-HYjB1YNuDI"];
const WALL=["2_ZXLTNgjeg", "jBWnWCUseyI", "dg194QhkGE0", "dwNzAA-G5a8", "lRFQZs2mR-I", "Uy6KpYZeERI", "K1fF0DFRJKw", "Hg0ZsqPn084", "N1j4gXlzKGI", "5ZJuAOeQX5Y", "n7PnboBqSLU", "KTMHd5qm7xQ", "EmTxU_-dPEM", "s2yqp_jMQEE", "u-5e6fMhKG0", "kD4U54YbCqU", "UAwvxZ8qJj4", "236bi4YaQuM", "JDozHJlRkuE", "snr9HhPGt2U", "1UTqafvnSNg", "CiFPVqZIUdg", "-HYjB1YNuDI"];
const stage=document.getElementById("stage");
WALL.forEach((id,i)=>{
 const tv=document.createElement("div"); tv.className="tv"; tv.dataset.video=id;
 tv.innerHTML=`<div class="screen"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="TIKOONZ video ${i+1}" loading="lazy"></div>`;
 tv.addEventListener("click",()=>playVideo(id,true));
 stage.appendChild(tv);
});
let heroPlayer,current=0;
function onYouTubeIframeAPIReady(){
 heroPlayer=new YT.Player("heroPlayer",{videoId:PLAYLIST[0],playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,modestbranding:1},
 events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){current=(current+1)%PLAYLIST.length;heroPlayer.loadVideoById(PLAYLIST[current])}}}});
}
function playVideo(id,sound){
 const i=PLAYLIST.indexOf(id);current=i>=0?i:0;
 if(!heroPlayer)return;
 heroPlayer.loadVideoById(id);
 if(sound){heroPlayer.unMute();heroPlayer.setVolume(100)}
 document.querySelector(".cinema").scrollIntoView({behavior:"smooth",block:"start"});
}
const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
</script>
</body></html>
