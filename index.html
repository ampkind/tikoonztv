<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TIKOONZ TV</title>
  <meta name="description" content="TIKOONZ TV — A curated music talk archive that plays continuously." />
  <style>
:root {
  --max: 1120px;
  --bg: #0b0b0f;
  --card: #141420;
  --line: rgba(255,255,255,.10);
  --line2: rgba(255,255,255,.16);
  --text2: rgba(255,255,255,.78);
  --text3: rgba(255,255,255,.62);
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: #fff;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 24px; }

header {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
  background: rgba(11,11,15,.72);
  border-bottom: 1px solid var(--line);
}
.headInner {
  max-width: var(--max);
  margin: 0 auto;
  padding: 14px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.brand img { height: 28px; display:block; }
nav { display:flex; align-items:center; gap: 16px; font-size: 14px; color: var(--text2); }
nav a { padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
nav a:hover { border-color: var(--line2); background: rgba(255,255,255,.03); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ratio { position: relative; width:100%; padding-top: 56.25%; background:#000; }

.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }

.thumb { border-radius: 14px; overflow:hidden; cursor:pointer; background: var(--card); border: 1px solid var(--line); }
.thumbImg { width:100%; aspect-ratio: 16/9; object-fit: cover; display:block; }

footer { margin-top: 28px; border-top: 1px solid var(--line); padding: 18px 0 26px; color: var(--text3); font-size: 12px; }
.footInner { max-width: var(--max); margin: 0 auto; padding: 0 24px; display:flex; justify-content:space-between; }
.footLinks { display:flex; gap: 14px; }
  </style>
</head>
<body>

<header>
  <div class="headInner">
    <a class="brand" href="index.html"><img src="tikoonz-logo.png" alt="TIKOONZ" /></a>
    <nav>
      <a href="about.html">About</a>
      <a href="shows.html">Shows</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="ratio"><div id="player"></div></div>
  </section>
  <div class="grid" id="grid" style="margin-top:14px;"></div>
</main>

<footer>
  <div class="footInner">
    <div>© TIKOONZ TV</div>
    <div class="footLinks">
      <a href="https://tikoonz.com" target="_blank">TIKOONZ</a>
      <a href="https://tikoonz.shop" target="_blank">SHOP</a>
      <a href="https://www.youtube.com/@tikoonz" target="_blank">@TIKOONZ</a>
    </div>
  </div>
</footer>

<script>
  const MAIN_VIDEO = { id: "k6vBizqAXBs" };
  const VIDEOS = [
    { id: "2_ZXLTNgjeg" },
    { id: "jBWnWCUseyI" },
    { id: "dg194QhkGE0" },
    { id: "dwNzAA-G5a8" },
    { id: "lRFQZs2mR-I" },
    { id: "Uy6KpYZeERI" },
  ];
  const QUEUE = [MAIN_VIDEO, ...VIDEOS];
  let currentIndex = 0;
  let ytPlayer = null;

  function thumbUrl(id){ return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }

  function renderGallery(){
    VIDEOS.forEach(v=>{
      const d=document.createElement("div");
      d.className="thumb";
      d.innerHTML=`<img class="thumbImg" src="${thumbUrl(v.id)}">`;
      d.onclick=()=>{ currentIndex=QUEUE.findIndex(x=>x.id===v.id); loadCurrent(); };
      grid.appendChild(d);
    });
  }

  function loadCurrent(){
    ytPlayer.loadVideoById(QUEUE[currentIndex].id);
  }

  function nextVideo(){
    currentIndex=(currentIndex+1)%QUEUE.length;
    loadCurrent();
  }

  function onYouTubeIframeAPIReady(){
    ytPlayer=new YT.Player("player",{
      videoId: MAIN_VIDEO.id,
      events:{ onStateChange:e=>{ if(e.data===0) nextVideo(); } }
    });
  }
  window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
  renderGallery();
  const tag=document.createElement("script");
  tag.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
</script>
</body>
</html>
