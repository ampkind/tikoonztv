<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shows · TIKOONZ TV</title>
<meta name="description" content="TIKOONZ TV — Shows." />
<style>
:root{
  --max:1120px;
  --bg:#0b0b0f;
  --card:#141420;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18);
  --text:#fff;
  --text2:rgba(255,255,255,.78);
  --text3:rgba(255,255,255,.58);
  --radius:16px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{color:inherit;text-decoration:none;}
.wrap{max-width:var(--max);margin:0 auto;padding:24px;}

header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(10px);
  background:rgba(11,11,15,.72);
  border-bottom:1px solid var(--line);
}
.headInner{
  max-width:var(--max);
  margin:0 auto;
  padding:8px 24px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
.brand img{
  width:min(610px,82vw);
  height:auto;
  display:block;
}
nav{
  display:flex;
  transform:translateY(-16px);
  align-items:center;
  justify-content:center;
  gap:34px;
  font-size:17px;
  color:var(--text2);
}
nav a{
  padding:9px 12px;
  border-radius:11px;
  border:1px solid transparent;
  transition:.15s ease;
}
nav a:hover, nav a.active{
  border-color:var(--line2);
  background:rgba(255,255,255,.04);
  color:#fff;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.35);
}
.ratio{position:relative;width:100%;padding-top:56.25%;background:#000;}
#player,#showPlayer{position:absolute;inset:0;width:100%;height:100%;}
iframe.video{position:absolute;inset:0;width:100%;height:100%;border:0;}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:14px;
}
.thumb{
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  background:var(--card);
  border:1px solid var(--line);
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.thumb:hover{
  transform:translateY(-2px);
  border-color:var(--line2);
  background:rgba(255,255,255,.04);
}
.thumbImg{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  background:#000;
}

.heroText{
  padding:36px 32px 32px;
  border-top:1px solid var(--line);
}
.sectionLabel{
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:rgba(255,255,255,.9);
  margin:0 0 16px;
}
.lead{
  color:#fff;
  font-size:clamp(30px,5vw,60px);
  line-height:1.08;
  letter-spacing:-.055em;
  font-weight:800;
  margin:0 0 18px;
  max-width:940px;
}
.smallCopy{
  color:var(--text2);
  font-size:16px;
  line-height:1.8;
  max-width:760px;
  margin:0;
}
.heroActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}
.btn{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.04);
  color:#fff;
  font-size:14px;
  letter-spacing:.04em;
  transition:.15s ease;
}
.btn:hover{background:rgba(255,255,255,.08);transform:translateY(-1px);}
.btn.ghost{color:var(--text2);background:rgba(255,255,255,.02);}

.content{
  position:relative;
  padding:52px 58px 54px;
  line-height:1.82;
  color:var(--text2);
  font-size:16px;
  text-align:left;
}
.content p{
  max-width:96ch;
  margin:0 0 18px;
  word-break:keep-all;
  overflow-wrap:normal;
}
.content .lead{
  max-width:100%;
  margin-bottom:28px;
  font-size:clamp(38px,5.2vw,64px);
  line-height:1.05;
}
.aboutTextGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 34px;
  margin-top:24px;
}
.aboutTextGrid p{
  margin:0;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.10);
  color:rgba(255,255,255,.80);
}
.langInline{
  position:absolute;
  right:30px;
  top:30px;
  display:flex;
  gap:4px;
}
.langInline button{
  background:transparent;
  border:1px solid rgba(255,255,255,.16);
  color:rgba(255,255,255,.78);
  padding:6px 9px;
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
}
.langInline button:hover{background:rgba(255,255,255,.05);}
.langInline button.active{
  border-color:rgba(255,255,255,.32);
  background:rgba(255,255,255,.04);
  color:#fff;
}

footer{
  margin-top:28px;
  border-top:1px solid var(--line);
  padding:18px 0 26px;
  color:var(--text3);
  font-size:12px;
}
.footInner{
  max-width:var(--max);
  margin:0 auto;
  padding:0 24px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.footLinks{display:flex;gap:10px;flex-wrap:wrap;}
.footLinks a{
  color:var(--text2);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:7px 10px;
}
.footLinks a:hover{border-color:rgba(255,255,255,.3);color:#fff;}

.soundBtn{
  position:absolute;
  right:14px;
  bottom:14px;
  width:42px;
  height:42px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.45);
  color:rgba(255,255,255,.9);
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:20;
  user-select:none;
}
.soundBtn:hover{background:rgba(0,0,0,.60);}

@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:820px){
  .content{padding:34px 24px 36px;}
  .aboutTextGrid{grid-template-columns:1fr;gap:4px;}
  .langInline{position:static;justify-content:flex-end;margin-bottom:18px;}
}
@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){
  .wrap{padding:12px;}
  .headInner{padding:6px 14px 6px;gap:4px;}
  .brand img{width:min(390px,86vw);}
  nav{gap:14px;font-size:14px;}
  nav a{padding:7px 10px;}
  .heroText{padding:24px 18px;}
  .grid{margin-top:10px;}
  .footInner{display:block;text-align:center;}
  .footLinks{justify-content:center;margin-top:12px;}
}

/* Final TIKOONZ TV header: matched to tikoonz.com */
header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(10px);
  background:rgba(11,11,15,.72);
  border-bottom:1px solid rgba(255,255,255,.10);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.headInner{
  max-width:var(--max);
  margin:0 auto;
  padding:34px 24px 26px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  position:relative;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
.brand img{
  height:118px;
  width:auto;
  max-width:680px;
  display:block;
}
nav{
  display:flex;
  transform:none !important;
  align-items:center;
  justify-content:center;
  gap:28px;
  font-size:16px;
  color:var(--text2);
}
nav a{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid transparent;
  transition:.16s ease;
}
nav a:hover,
nav a.active{
  border-color:var(--line2);
  background:rgba(255,255,255,.03);
  color:#fff;
}
.globalLang{
  position:absolute;
  top:34px;
  right:24px;
  display:flex;
  gap:8px;
  z-index:60;
}
.globalLang button{
  appearance:none;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.78);
  padding:7px 9px;
  border-radius:11px;
  font-size:12px;
  letter-spacing:.06em;
  cursor:pointer;
}
.globalLang button[aria-pressed="true"]{
  color:#fff;
  border-color:rgba(255,255,255,.38);
  background:rgba(255,255,255,.08);
}
.langInline{display:none !important;}
@media(max-width:640px){
  .headInner{padding:18px 14px 14px;gap:12px;}
  .brand img{height:78px;max-width:420px;}
  nav{gap:14px;font-size:13px;}
  nav a{padding:6px 9px;}
  .globalLang{top:12px;right:12px;}
  .globalLang button{padding:6px 8px;font-size:11px;}
}

</style>
</head>
<body>


<header>
  <div class="headInner">
    <a class="brand" href="index.html" aria-label="TIKOONZ TV Home">
      <img src="tikoonz-logo.png" alt="TIKOONZ TV" />
    </a>
    <nav aria-label="Primary">
      <a href="index.html" class="" data-i18n="nav.home">Home</a>
      <a href="about.html" class="" data-i18n="nav.about">About</a>
      <a href="shows.html" class="active" data-i18n="nav.shows">Shows</a>

</header>


<main class="wrap">
  <section class="card">
    <div class="ratio"><div id="showPlayer"></div><div class="soundBtn" id="soundBtn" aria-label="Enable sound">🔊</div></div>

      <p class="sectionLabel" data-i18n="shows.label">Shows</p>

      <a href="https://www.youtube.com/@tikoonz" target="_blank" rel="noopener">@TIKOONZ</a>
    </div>
  </div>
</footer>


<script>
(function(){
  window.TIKOONZ_TV_LANG_KEY = 'tikoonz_tv_lang';

  window.getTikoonzTVLang = function(){
    try{
      const saved = localStorage.getItem(window.TIKOONZ_TV_LANG_KEY);
      if(saved === 'en' || saved === 'ko') return saved;
    }catch(e){}
    const nav = (navigator.language || 'en').toLowerCase();
    return nav.startsWith('ko') ? 'ko' : 'en';
  };

  window.saveTikoonzTVLang = function(lang){
    try{ localStorage.setItem(window.TIKOONZ_TV_LANG_KEY, lang); }catch(e){}
  };

  window.setGlobalLangButtons = function(lang){
    const en = document.getElementById('btnEN');
    const ko = document.getElementById('btnKO');
    if(en) en.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    if(ko) ko.setAttribute('aria-pressed', lang === 'ko' ? 'true' : 'false');
  };
})();
</script>

<script>
const SHOWS_I18N = {
  en: {
    "nav.home": "Home",
    "nav.about": "About",
    "nav.shows": "Shows",
    "shows.label": "Shows",
    "shows.title": "Talks, episodes, and music stories.",
    "shows.copy": "Watch TIKOONZ TV videos and episodes in continuous playback."
  },
  ko: {
    "nav.home": "홈",
    "nav.about": "소개",
    "nav.shows": "쇼",
    "shows.label": "쇼",
    "shows.title": "토크, 에피소드, 음악 이야기.",
    "shows.copy": "TIKOONZ TV의 주요 영상과 에피소드를 연속 재생으로 감상할 수 있습니다."
  }
};
function applyLang(lang){
  lang = lang === 'ko' ? 'ko' : 'en';
  const dict = SHOWS_I18N[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(dict[key]) el.textContent = dict[key];
  });
  document.documentElement.lang = lang;
  setGlobalLangButtons(lang);
  saveTikoonzTVLang(lang);
}
document.getElementById("btnEN").addEventListener("click",()=>applyLang("en"));
document.getElementById("btnKO").addEventListener("click",()=>applyLang("ko"));
applyLang(getTikoonzTVLang());
</script>

<script>
const MAIN_VIDEO = { id: "XPd7XutfqSY" };
const VIDEOS = [
  { id: "N1j4gXlzKGI" },
  { id: "5ZJuAOeQX5Y" },
  { id: "n7PnboBqSLU" },
  { id: "KTMHd5qm7xQ" },
  { id: "EmTxU_-dPEM" },
  { id: "s2yqp_jMQEE" },
  { id: "u-5e6fMhKG0" },
  { id: "kD4U54YbCqU" }
];

const QUEUE = [MAIN_VIDEO, ...VIDEOS];
let currentIndex = 0;
let ytPlayer = null;
const soundBtn = document.getElementById("soundBtn");
function showSoundBtn(){ if(soundBtn) soundBtn.style.display = "flex"; }
function hideSoundBtn(){ if(soundBtn) soundBtn.style.display = "none"; }
const grid = document.getElementById("grid");
function thumbUrl(id){ return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }

function renderGallery(){
  VIDEOS.forEach((v)=>{
    const card = document.createElement("div");
    card.className = "thumb";
    card.innerHTML = `<img class="thumbImg" src="${thumbUrl(v.id)}" alt="">`;
    card.addEventListener("click",()=>{
      currentIndex = 1 + VIDEOS.findIndex(x => x.id === v.id);
      loadCurrent(true);
    });
    grid.appendChild(card);
  });
}
function loadCurrent(autoplay=true){
  const v = QUEUE[currentIndex];
  if(ytPlayer){
    ytPlayer.loadVideoById({ videoId:v.id, suggestedQuality:"hd1080" });
    if(!autoplay) ytPlayer.pauseVideo();
  }
  window.scrollTo({ top:0, behavior:"smooth" });
}
function nextVideo(){
  currentIndex = (currentIndex + 1) % QUEUE.length;
  loadCurrent(true);
}
function ensureFallback(){
  const host = document.getElementById("showPlayer");
  if(!host || host.querySelector("iframe")) return;
  host.innerHTML = `<iframe class="video" src="https://www.youtube-nocookie.com/embed/${MAIN_VIDEO.id}?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1" title="Shows" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
}
function onYouTubeIframeAPIReady(){
  try{
    ytPlayer = new YT.Player("showPlayer",{
      videoId:MAIN_VIDEO.id,
      playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,modestbranding:1},
      events:{
        onReady:()=>{
          try{ ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo(); }catch(e){}
          setTimeout(()=>{
            try{
              const muted = ytPlayer.isMuted && ytPlayer.isMuted();
              const state = ytPlayer.getPlayerState && ytPlayer.getPlayerState();
              if(muted || state !== YT.PlayerState.PLAYING) showSoundBtn(); else hideSoundBtn();
            }catch(e){ showSoundBtn(); }
          },900);
        },
        onStateChange:(e)=>{ if(e.data === YT.PlayerState.ENDED) nextVideo(); },
        onError:()=>ensureFallback()
      }
    });
  }catch(e){ ensureFallback(); }
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
renderGallery();
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
tag.onerror = ensureFallback;
document.head.appendChild(tag);
setTimeout(ensureFallback, 1200);
if(soundBtn){
  soundBtn.addEventListener("click",()=>{
    try{ ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo(); }catch(e){}
    hideSoundBtn();
  });
}
</script>
