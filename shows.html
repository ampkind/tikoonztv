<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shows · TIKOONZ TV</title>
</head>
<body style="margin:0;background:#0b0b0f;color:#fff;font-family:system-ui">

<header style="padding:16px">
<a href="index.html"><img src="tikoonz-logo.png" height="28"></a>
</header>

<div style="max-width:1120px;margin:0 auto;padding:24px">
  <div id="showPlayer" style="aspect-ratio:16/9"></div>
  <div id="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px"></div>
</div>

<footer style="padding:16px;border-top:1px solid rgba(255,255,255,.1)">
  <a href="https://tikoonz.com">TIKOONZ</a> ·
  <a href="https://tikoonz.shop">SHOP</a> ·
  <a href="https://www.youtube.com/@tikoonz">@TIKOONZ</a>
</footer>

<script>
const MAIN={id:"XPd7XutfqSY"};
const EP=[
{id:"N1j4gXlzKGI"},
{id:"5ZJuAOeQX5Y"},
{id:"n7PnboBqSLU"},
{id:"KTMHd5qm7xQ"},
{id:"EmTxU_-dPEM"},
{id:"s2yqp_jMQEE"}
];
const Q=[MAIN,...EP];
let i=0,p;

function thumb(id){return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`}

EP.forEach((v,idx)=>{
  const d=document.createElement("img");
  d.src=thumb(v.id);
  d.style.width="100%";
  d.onclick=()=>{i=idx+1;p.loadVideoById(Q[i].id)};
  grid.appendChild(d);
});

function next(){i=(i+1)%Q.length;p.loadVideoById(Q[i].id)}

function onYouTubeIframeAPIReady(){
  p=new YT.Player("showPlayer",{
    videoId:MAIN.id,
    events:{onStateChange:e=>{if(e.data===0)next()}}
  });
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
const s=document.createElement("script");
s.src="https://www.youtube.com/iframe_api";
document.head.appendChild(s);
</script>

</body>
</html>
