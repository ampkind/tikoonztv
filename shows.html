<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shows · TIKOONZ TV</title>
  <meta name="description" content="TIKOONZ TV — Shows. Continuous playback with a curated queue." />
  <style>
:root {
  --max: 1120px;
  --bg: #0b0b0f;
  --card: #141420;
  --line: rgba(255,255,255,.10);
  --line2: rgba(255,255,255,.16);
  --text2: rgba(255,255,255,.78);
  --text3: rgba(255,255,255,.62);
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: #fff;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 24px; }

header {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
  background: rgba(11,11,15,.72);
  border-bottom: 1px solid var(--line);
}
.headInner {
  max-width: var(--max);
  margin: 0 auto;
  padding: 14px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.brand img { height: 28px; display:block; }
nav { display:flex; align-items:center; gap: 16px; font-size: 14px; color: var(--text2); }
nav a { padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
nav a:hover { border-color: var(--line2); background: rgba(255,255,255,.03); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.playerTop { padding: 18px 16px 12px; }
.kicker { font-size: 12px; color: var(--text3); margin:0 0 6px; letter-spacing:.14em; text-transform: uppercase; }
.h1 { font-size: 18px; font-weight: 850; margin:0 0 6px; }
.lead { font-size: 13px; color: var(--text2); margin:0; line-height:1.65; max-width: 980px; }

.ratio { position: relative; width:100%; padding-top: 56.25%; background:#000; } /* 16:9 */
#player, #showPlayer { position:absolute; inset:0; width:100%; height:100%; }

.sectionTitle {
  margin: 18px 0 10px;
  display:flex; align-items: baseline; justify-content:space-between; gap: 12px;
}
.sectionTitle h2 { margin:0; font-size: 12px; letter-spacing:.14em; text-transform: uppercase; color: rgba(255,255,255,.86); }
.sectionTitle .hint { margin:0; font-size: 12px; color: var(--text3); }

.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }

.thumb { border-radius: 14px; overflow:hidden; cursor:pointer; background: var(--card); border: 1px solid var(--line);
  transition: transform .08s ease, border-color .08s ease; }
.thumb:hover { transform: translateY(-1px); border-color: var(--line2); }
.thumbImg { width:100%; aspect-ratio: 16/9; object-fit: cover; display:block; background:#000; }

.content { padding: 22px; line-height: 1.85; color: var(--text2); font-size: 14px; }
.sectionLabel { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.85); margin: 0 0 14px; }
.content p { max-width: 760px; margin: 0 0 16px; }

footer { margin-top: 28px; border-top: 1px solid var(--line); padding: 18px 0 26px; color: var(--text3); font-size: 12px; }
.footInner { max-width: var(--max); margin: 0 auto; padding: 0 24px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap: 12px; }
.footLinks { display:flex; gap: 14px; flex-wrap:wrap; }
.footLinks a { color: var(--text2); }
.footLinks a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="headInner">
    <a class="brand" href="index.html" aria-label="TIKOONZ TV Home">
      <img src="tikoonz-logo.png" alt="TIKOONZ" />
    </a>
    <nav aria-label="Primary">
      <a href="about.html">About</a>
      <a href="shows.html" style="border-color: rgba(255,255,255,.16); background: rgba(255,255,255,.03);">Shows</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="playerTop">
      <p class="kicker">Show</p>
      <p class="h1">Continuous Playback</p>
      <p class="lead">Autoplays muted for reliability. Click the player to enable sound.</p>
    </div>
    <div class="ratio">
      <div id="showPlayer"></div>
    </div>
  </section>

  <div class="sectionTitle">
    <h2>Episodes</h2>
    <p class="hint">Click any thumbnail to jump into the queue.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>


<footer>
  <div class="footInner">
    <div>© TIKOONZ TV</div>
    <div class="footLinks">
      <a href="https://tikoonz.com" target="_blank" rel="noopener">TIKOONZ</a>
      <a href="https://tikoonz.shop" target="_blank" rel="noopener">SHOP</a>
      <a href="https://www.youtube.com/@tikoonz" target="_blank" rel="noopener">@TIKOONZ</a>
    </div>
  </div>
</footer>


<script>
  const MAIN_VIDEO = { id: "XPd7XutfqSY", title: "SHOW MAIN" };
  const EPISODES = [
    { id: "N1j4gXlzKGI", title: "Episode 01" },
    { id: "5ZJuAOeQX5Y", title: "Episode 02" },
    { id: "n7PnboBqSLU", title: "Episode 03" },
    { id: "KTMHd5qm7xQ", title: "Episode 04" },
    { id: "EmTxU_-dPEM", title: "Episode 05" },
    { id: "s2yqp_jMQEE", title: "Episode 06" },
  ];

  const QUEUE = [MAIN_VIDEO, ...EPISODES];
  let currentIndex = 0;
  let ytPlayer = null;

  const grid = document.getElementById("grid");
  function thumbUrl(id) { return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }

  function renderGallery() {
    EPISODES.forEach((v, idx) => {
      const card = document.createElement("div");
      card.className = "thumb";
      card.innerHTML = `<img class="thumbImg" src="${thumbUrl(v.id)}" alt="">`;
      card.addEventListener("click", () => {
        currentIndex = idx + 1; // +1 because MAIN is index 0
        loadCurrent(true);
      });
      grid.appendChild(card);
    });
  }

  function loadCurrent(autoplay = true) {
    const v = QUEUE[currentIndex];
    if (ytPlayer) {
      ytPlayer.loadVideoById({ videoId: v.id, suggestedQuality: "hd1080" });
      if (!autoplay) ytPlayer.pauseVideo();
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function nextVideo() {
    currentIndex = (currentIndex + 1) % QUEUE.length;
    loadCurrent(true);
  }

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player("showPlayer", {
      videoId: MAIN_VIDEO.id,
      playerVars: {
        autoplay: 1,
        playsinline: 1,
        rel: 0,
        modestbranding: 1,
        origin: window.location.origin
      },
      events: {
        onReady: () => {
          try { ytPlayer.mute(); } catch(e) {}
          currentIndex = 0;
          loadCurrent(true);
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) nextVideo();
        }
      }
    });
  }

  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  renderGallery();
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
</script>
</body>
</html>
