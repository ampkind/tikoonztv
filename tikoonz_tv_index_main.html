<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TIKOONZ TV</title>
  <meta name="description" content="TIKOONZ TV — selected episodes. Watch inside this site." />
  <style>
    :root { --max: 1100px; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0b0f; color:#fff; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 24px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding: 8px 0 18px; }
    .brand { font-weight:800; letter-spacing: .5px; font-size: 20px; }
    .sub { opacity:.8; font-size: 13px; }

    .playerCard { background:#141420; border:1px solid rgba(255,255,255,.08); border-radius: 16px; overflow:hidden; }
    .playerTop { padding: 14px 14px 10px; }
    .nowTitle { font-size: 16px; font-weight: 700; margin:0 0 6px; }
    .nowMeta { font-size: 12px; opacity:.75; margin:0; }
    .ratio { position: relative; width:100%; padding-top: 56.25%; background:#000; }
    iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

    .sectionTitle { margin: 22px 0 10px; font-size: 14px; opacity:.9; }
    .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 980px){ .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px){ .grid { grid-template-columns: repeat(2, 1fr); } }
    .thumb {
      background:#141420; border:1px solid rgba(255,255,255,.08);
      border-radius: 14px; overflow:hidden; cursor:pointer; transition: transform .08s ease, border-color .08s ease;
    }
    .thumb:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    .thumbImg { width:100%; aspect-ratio: 16/9; object-fit: cover; display:block; background:#000; }
    .thumbBody { padding: 10px 10px 12px; }
    .thumbTitle { font-size: 13px; font-weight:700; margin:0 0 6px; line-height: 1.25; }
    .thumbMeta { font-size: 11px; opacity:.72; margin:0; }

    footer { margin-top: 26px; opacity:.7; font-size: 12px; padding: 10px 0 20px; }
    .note { opacity:.75; font-size: 12px; margin-top: 8px; line-height: 1.45; }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">TIKOONZ TV</div>
        <div class="sub">Selected episodes · Watch inside this site</div>
      </div>
      <div class="sub">© TIKOONZ</div>
    </header>

    <section class="playerCard">
      <div class="playerTop">
        <p class="nowTitle" id="nowTitle">—</p>
        <p class="nowMeta" id="nowMeta">—</p>
      </div>
      <div class="ratio">
        <iframe
          id="player"
          src=""
          title="TIKOONZ TV Player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <h2 class="sectionTitle">GALLERY</h2>
    <div class="grid" id="grid"></div>

    <p class="note">
      안내: 영상은 유튜브 임베드로 재생됩니다. 기본 동선은 tikoonz.tv 안에서 유지되도록 구성했으며,
      플레이어 자체 기능(예: “YouTube에서 보기”)은 유튜브 정책/환경에 따라 일부 노출될 수 있습니다.
    </p>

    <footer>
      Contact · Business inquiries: (email / contact link)
    </footer>
  </div>

  <script>
    const MAIN_VIDEO = { id: "k6vBizqAXBs", title: "Main Feature", meta: "TIKOONZ TV" };

    const VIDEOS = [
      { id: "2_ZXLTNgjeg", title: "Episode 01", meta: "TIKOONZ TV" },
      { id: "jBWnWCUseyI", title: "Episode 02", meta: "TIKOONZ TV" },
      { id: "dg194QhkGE0", title: "Episode 03", meta: "TIKOONZ TV" },
      { id: "dwNzAA-G5a8", title: "Episode 04", meta: "TIKOONZ TV" },
      { id: "lRFQZs2mR-I", title: "Episode 05", meta: "TIKOONZ TV" },
      { id: "Uy6KpYZeERI", title: "Episode 06", meta: "TIKOONZ TV" },
    ];

    const ORIGIN = encodeURIComponent(location.origin);
    const makeEmbedUrl = (id) =>
      `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1&origin=${ORIGIN}`;

    const player = document.getElementById("player");
    const nowTitle = document.getElementById("nowTitle");
    const nowMeta = document.getElementById("nowMeta");
    const grid = document.getElementById("grid");

    function setNow(video) {
      nowTitle.textContent = video.title;
      nowMeta.textContent = video.meta;
      player.src = makeEmbedUrl(video.id);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function thumbUrl(id) {
      return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    }

    VIDEOS.forEach((v, idx) => {
      const card = document.createElement("div");
      card.className = "thumb";
      card.innerHTML = `
        <img class="thumbImg" src="${thumbUrl(v.id)}" alt="${v.title}">
        <div class="thumbBody">
          <p class="thumbTitle">${v.title}</p>
          <p class="thumbMeta">${v.meta}</p>
        </div>
      `;
      card.addEventListener("click", () => setNow(v));
      grid.appendChild(card);
    });

    // Default main player (not part of gallery)
    setNow(MAIN_VIDEO);
</script>
</body>
</html>
