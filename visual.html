<script>
(function(){
  function switchMain(id){
    var main=document.getElementById('mainPlayer');
    if(!main) return;
    var ids=(document.body.getAttribute('data-playlist')||'').split(',').filter(Boolean);
    var i=ids.indexOf(id);
    var order=i>=0 ? ids.slice(i).concat(ids.slice(0,i)) : [id];
    main.src='https://www.youtube.com/embed/'+encodeURIComponent(id)
      +'?autoplay=1&mute=1&controls=1&rel=0&playsinline=1&loop=1&playlist='+order.join(',');
    var target=main.closest('.mainScreen')||main;
    setTimeout(function(){target.scrollIntoView({behavior:'smooth',block:'center'});},50);
  }
  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('.tv[data-id]').forEach(function(tv){
      tv.setAttribute('role','button');
      tv.setAttribute('tabindex','0');
      tv.onclick=function(e){e.preventDefault();e.stopPropagation();switchMain(tv.dataset.id);return false;};
      tv.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();switchMain(tv.dataset.id);}};
    });
  });
  window.tikoonzSwitchMain=switchMain;
})();
</script>
